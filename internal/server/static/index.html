<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Settings Explorer</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <header class="topbar">
    <div class="brand">
      <h1>Power Settings Explorer</h1>
      <p id="status">正在连接本地后端...</p>
    </div>
    <div class="schemeWrap">
      <label for="schemeSelect">电源方案</label>
      <select id="schemeSelect"></select>
    </div>
    <div class="actions">
      <button id="refreshBtn" title="刷新全部 (F5)">刷新</button>
      <button id="exportBtn" title="导出当前方案为 XML">导出 XML</button>
      <button id="scriptBtn" title="导出可执行的 PowerShell 脚本">导出脚本</button>
      <label class="fileBtn" title="从 XML 文件导入设置">导入 XML<input id="importInput" type="file" accept=".xml,text/xml,application/xml"></label>
    </div>
  </header>

  <main class="layout">
    <section class="content">
      <div class="toolbar">
        <div class="searchWrap">
          <input id="filterInput" type="search" placeholder="搜索设置、分组或 GUID (Ctrl+K)">
          <button id="clearSearch" class="searchClear" hidden title="清空搜索">×</button>
        </div>
        <label><input id="showHidden" type="checkbox" checked> 显示隐藏项</label>
        <select id="diffTarget" title="对比模式">
          <option value="">显示全部</option>
          <option value="default">与默认值对比</option>
        </select>
        <button id="collapseBtn">全部折叠</button>
      </div>
      <div id="settings"></div>
    </section>
  </main>

  <footer class="shortcuts">
    <span><kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索</span>
    <span><kbd>F5</kbd> 刷新</span>
    <span><kbd>Esc</kbd> 清空搜索</span>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
